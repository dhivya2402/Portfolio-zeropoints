
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Title -->
    <title>
      ZeroPoint Labs | Web Development & Digital Solutions
    </title>

    <!-- SEO Description -->
    <meta
      name="description"
      content="ZeroPoint Labs offers website development, custom business software, content creation, and automation solutions to help businesses grow."
    />

    <!-- Search Engine Indexing -->
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://portfolio-zeropoints.vercel.app/"
    />

    <!-- ZPL Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/zpl-logo.png"
    />

    <!-- Fonts (Montserrat + Lora, shared with the Services page) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap"
    />

    <!-- Browser Theme -->
    <meta name="theme-color" content="#211A15" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta
      property="og:site_name"
      content="ZeroPoint Labs"
    />
    <meta
      property="og:title"
      content="ZeroPoint Labs | Web Development & Digital Solutions"
    />
    <meta
      property="og:description"
      content="Build. Grow. Create. Automate. Explore digital solutions from ZeroPoint Labs."
    />
    <meta
      property="og:url"
      content="https://portfolio-zeropoints.vercel.app/"
    />
    <meta
      property="og:image"
      content="https://portfolio-zeropoints.vercel.app/zpl-logo.png"
    />

    <!-- Twitter / X Sharing -->
    <meta
      name="twitter:card"
      content="summary"
    />
    <meta
      name="twitter:title"
      content="ZeroPoint Labs | Web Development & Digital Solutions"
    />
    <meta
      name="twitter:description"
      content="Website development, business software, content creation, and automation solutions by ZeroPoint Labs."
    />
    <meta
      name="twitter:image"
      content="https://portfolio-zeropoints.vercel.app/zpl-logo.png"
    />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
